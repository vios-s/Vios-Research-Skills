name: Verify setup scripts

on:
  push:
    branches: [main]
    paths:
      - "install/**"
      - ".github/workflows/verify-setup.yml"
  pull_request:
    branches: [main]
    paths:
      - "install/**"
      - ".github/workflows/verify-setup.yml"

jobs:
  # ── Static analysis ────────────────────────────────────────────────────────

  shellcheck:
    name: ShellCheck (setup.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck install/setup.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer (setup.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse setup.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $r = Invoke-ScriptAnalyzer -Path install/setup.ps1 -Severity Error
          $r | Format-Table RuleName,Severity,Line,Message -AutoSize
          if ($r) { exit 1 }

  # ── Integration tests: setup.sh ───────────────────────────────────────────

  test-sh:
    name: setup.sh / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run setup.sh with isolated HOME
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME/.claude"
          bash install/setup.sh

      - name: Verify skills directory created
        run: test -d "$RUNNER_TEMP/fakehome/.agents/skills"

      - name: Verify hook injected into settings.json
        run: |
          grep -q "skills" "$RUNNER_TEMP/fakehome/.claude/settings.json"

  test-sh-no-node:
    name: setup.sh / Linux / node absent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shadow node and npx with stubs
        run: |
          mkdir -p "$RUNNER_TEMP/nonodepath"
          printf '#!/bin/sh\necho "stub: node not available"; exit 127\n' > "$RUNNER_TEMP/nonodepath/node"
          printf '#!/bin/sh\necho "stub: npx not available"; exit 127\n'  > "$RUNNER_TEMP/nonodepath/npx"
          chmod +x "$RUNNER_TEMP/nonodepath/node" "$RUNNER_TEMP/nonodepath/npx"
          echo "$RUNNER_TEMP/nonodepath" >> "$GITHUB_PATH"

      - name: Confirm node is absent in PATH
        run: node --version 2>&1 | grep "stub" || true

      - name: Run setup.sh (should install node via nvm then proceed)
        run: |
          export HOME="$RUNNER_TEMP/fakehome-nonode"
          mkdir -p "$HOME/.claude"
          # Restore real node for PATH *after* nvm installs it; nvm sources itself
          bash install/setup.sh

      - name: Verify node is now available
        run: |
          export HOME="$RUNNER_TEMP/fakehome-nonode"
          . "$HOME/.nvm/nvm.sh"
          node --version

      - name: Verify skills directory created
        run: test -d "$RUNNER_TEMP/fakehome-nonode/.agents/skills"

      - name: Verify hook injected into settings.json
        run: grep -q "skills" "$RUNNER_TEMP/fakehome-nonode/.claude/settings.json"

  # ── Integration test: setup.ps1 ───────────────────────────────────────────

  test-ps1:
    name: setup.ps1 / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run setup.ps1 with isolated USERPROFILE
        shell: pwsh
        run: |
          $env:USERPROFILE = "$env:RUNNER_TEMP\fakehome"
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.claude" | Out-Null
          pwsh -File install/setup.ps1

      - name: Verify skills directory created
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\fakehome\.agents\skills")) {
            Write-Error "Skills directory not found"; exit 1
          }

      - name: Verify hook injected into settings.json
        shell: pwsh
        run: |
          $path = "$env:RUNNER_TEMP\fakehome\.claude\settings.json"
          $content = Get-Content $path -Raw
          if ($content -notlike "*skills*") {
            Write-Error "Hook not found in $path"; exit 1
          }
          Write-Host "Hook OK"
