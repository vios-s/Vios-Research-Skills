name: Verify setup scripts

on:
  push:
    branches: [main]
    paths:
      - "install/**"
      - ".github/workflows/verify-setup.yml"
  pull_request:
    branches: [main]
    paths:
      - "install/**"
      - ".github/workflows/verify-setup.yml"

jobs:
  # ── Static analysis ────────────────────────────────────────────────────────

  shellcheck:
    name: ShellCheck (setup.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck install/setup.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer (setup.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse setup.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $r = Invoke-ScriptAnalyzer -Path install/setup.ps1 -Severity Error
          $r | Format-Table RuleName,Severity,Line,Message -AutoSize
          if ($r) { exit 1 }

  # ── Integration tests: setup.sh ───────────────────────────────────────────

  test-sh:
    name: setup.sh / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run setup.sh
        run: bash install/setup.sh

      - name: Verify hook injected into settings.json
        run: grep -q "skills" ~/.claude/settings.json

  # "node absent" path — Debian slim container has no Node.js in its PATH,
  # so setup.sh must install it via nvm before proceeding.
  test-sh-no-node:
    name: setup.sh / Linux / node absent (container)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim
    steps:
      - name: Install prerequisites (curl + git; no Node.js)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl git ca-certificates

      - uses: actions/checkout@v4

      - name: Confirm node absent from container PATH
        run: "! command -v node"

      - name: Run setup.sh (auto-installs Node.js via nvm)
        run: |
          mkdir -p /root/.claude
          HOME=/root bash install/setup.sh

      - name: Verify node now available via nvm
        run: |
          . /root/.nvm/nvm.sh
          node --version

      - name: Verify hook injected into settings.json
        run: grep -q "skills" /root/.claude/settings.json

  # ── Integration test: setup.ps1 ───────────────────────────────────────────

  test-ps1:
    name: setup.ps1 / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run setup.ps1
        shell: pwsh
        run: pwsh -File install/setup.ps1

      - name: Verify hook injected into settings.json
        shell: pwsh
        run: |
          $content = Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw
          if ($content -notlike "*skills*") {
            Write-Error "Hook not found in settings.json"; exit 1
          }
          Write-Host "Hook OK"
