name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Lint SKILL.md frontmatter
        run: python scripts/lint_skills.py

      - name: Check SUMMARY.md is up to date
        run: python scripts/generate_summary.py --check

      - name: Check eidf-job skill against its bundled templates
        run: python scripts/check_eidf_job.py
